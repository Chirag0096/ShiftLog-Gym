name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Space via Git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_TOKEN is not set in GitHub Secrets. Please add it to your repo secrets."
            exit 1
          fi
          git config --global user.email "chiragaswal2@gmail.com"
          git config --global user.name "Chirag Aswal"
          git remote add space https://Chirag0123:$HF_TOKEN@huggingface.co/spaces/Chirag0123/shiftlog-gym || git remote set-url space https://Chirag0123:$HF_TOKEN@huggingface.co/spaces/Chirag0123/shiftlog-gym
          git push --force space main
