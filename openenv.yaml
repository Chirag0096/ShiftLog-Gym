name: shiftlog-gym
version: 0.2.0
description: >
  RL environment for training LLM agents to manage memory
  across a simulated SRE on-call shift with causal incidents.
action_space:
  type: discrete
  tools:
    - read_shift_log
    - append_shift_log
    - update_shift_log
    - handoff_summary
    - inspect_service
    - inspect_dependency
    - run_diagnostic
    - apply_mitigation
    - resolve_incident
observation_space:
  type: dict
  keys:
    - incident_context
    - shift_log
    - service_topology
    - time_context
reward_range: [-2.0, 1.0]
max_episode_steps: 30
tags:
  - sre
  - memory
  - long-horizon
  - professional-tasks
